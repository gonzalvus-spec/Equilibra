name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: equilibra-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS folder if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Link GoogleService-Info.plist to Xcode
        run: |
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            ruby -e '
              require "xcodeproj"
              project_path = "ios/Runner.xcodeproj"
              project = Xcodeproj::Project.open(project_path)
              target = project.targets.first
              group = project.main_group["Runner"]
              unless group.files.any? { |f| f.path == "GoogleService-Info.plist" }
                file_ref = group.new_file("GoogleService-Info.plist")
                target.resources_build_phase.add_file_reference(file_ref)
                project.save
              end
            '
          fi

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r equilibra-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: equilibra-release-ipa
          path: equilibra-unsigned.ipa
          if-no-files-found: error